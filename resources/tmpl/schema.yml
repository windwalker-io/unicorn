# Schema template for `mig:from`
#
#   php windwalker mig:from path/to/schema.yml
#
# Top-level key  = table name (ASCII only). The first `_` segment is the migration group,
#                  e.g. `article` and `article_tag_map` both go to the `Article` group.
#                  Names starting with `_` or named `Sample` are ignored.
# Second level   = column name.
# Column value   = a map of attributes, or a string as a shorthand for `type`.
#
# Attribute keys are case-insensitive and accept `key_name` / `Key Name` / `keyName`.
#
#   type         int, bigint, tinyint, varchar, char, text, decimal, datetime, json, uuid, uuidbin, ...
#                A column without a type is reported as an error.
#   length       Length or precision, e.g. 255 or '10,2'
#   nullable     `allow` to make the column nullable. (`null` also works, but must be quoted: "null")
#   signed       `unsigned` to make a number column unsigned
#   default      Default value
#   key          `Primary (AI)`, `Index` or `Unique`
#   key_name     Columns sharing the same name form one composite index/unique key
#   description  Column comment
#   note         Extra comment, appended to description

article:
  id:
    type: int
    signed: unsigned
    key: Primary (AI)
  category_id:
    type: int
    signed: unsigned
    key: Index
    description: Category ID
  title:
    type: varchar
    length: 255
    description: Article title
  alias:
    type: varchar
    length: 255
    key: Unique
  content: text
  price:
    type: decimal
    length: '10,2'
    default: 0
    note: Tax included
  image:
    type: varchar
    length: 1024
    nullable: allow
  params: json
  state:
    type: tinyint
    length: 1
    default: 1
  created:
    type: datetime
    nullable: allow
  created_by:
    type: int
    signed: unsigned
    default: 0

article_tag_map:
  id:
    type: int
    signed: unsigned
    key: Primary (AI)
  article_id:
    type: int
    signed: unsigned
    key: Unique
    key_name: article_tag
  tag_id:
    type: int
    signed: unsigned
    key: Unique
    key_name: article_tag
